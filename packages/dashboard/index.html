<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title></title>
    <link
            id="dashboard-favicon"
            rel="icon"
            type="image/png"
            sizes="32x32"
            data-dashboard-href="/api/v1/public/branding/icon/32"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <link
            id="dashboard-apple-touch-icon"
            rel="apple-touch-icon"
            type="image/png"
            sizes="180x180"
            data-dashboard-href="/api/v1/public/branding/icon/180"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link id="dashboard-manifest" rel="manifest" data-dashboard-href="/manifest.json"/>
    <link
            rel="preload"
            data-dashboard-href="/fonts/Inter-400.ttf"
            as="font"
            type="font/ttf"
            crossorigin
    />
    <link
            rel="preload"
            data-dashboard-href="/fonts/Inter-500.ttf"
            as="font"
            type="font/ttf"
            crossorigin
    />
    <link
            rel="preload"
            data-dashboard-href="/fonts/Play-Regular.ttf"
            as="font"
            type="font/ttf"
            crossorigin
    />
    <script>
      (() => {
        const dashboardRouteRoots = new Set([
          "login",
          "code",
          "experimental",
          "error",
          "my",
          "main",
          "app",
          "admin",
          "idm",
        ]);
        const segments = window.location.pathname.split("/").filter(Boolean);
        const routeIndex = segments.findIndex((segment) =>
          dashboardRouteRoots.has(segment)
        );
        const baseSegments =
          routeIndex >= 0
            ? segments.slice(0, routeIndex)
            : dashboardRouteRoots.has(segments[0] || "")
              ? []
              : segments.slice(0, 1);
        const base = baseSegments.length ? `/${baseSegments.join("/")}` : "";

        document
          .querySelectorAll("link[data-dashboard-href]")
          .forEach((element) => {
            const resourcePath = element.getAttribute("data-dashboard-href");

            if (resourcePath) {
              element.setAttribute("href", `${base}${resourcePath}`);
            }
          });
      })();
    </script>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/app/index.tsx"></script>
</body>
</html>
