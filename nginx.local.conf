events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream backend { server 127.0.0.1:3005; }
  upstream oidc { server 127.0.0.1:3003; }
  upstream auth { server 127.0.0.1:3007; }
  upstream template_frontend { server 127.0.0.1:8088; }
  upstream template_backend { server 127.0.0.1:3010; }
  upstream cr_frontend { server 127.0.0.1:8090; }
  upstream cr_backend { server 127.0.0.1:3012; }
  upstream skzi_frontend { server 127.0.0.1:8089; }
  upstream skzi_backend { server 127.0.0.1:3011; }

  server {
    server_name local.trusted.plus;
    listen 3443 ssl;

    ssl_certificate certs/local.trusted.plus.pem;
    ssl_certificate_key certs/local.trusted.plus-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { return 404 "mTLS endpoints only"; }

    location ^~ /id/api/mtls {
      rewrite ^/id(/api/mtls.*)$ $1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
      proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
      proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
      proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
      proxy_set_header X-SSL-Client-Issuer $ssl_client_i_dn;
      proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://backend;
    }
  }

  server {
    server_name local.trusted.plus;
    listen 443 ssl;
    client_header_buffer_size 512k;
    large_client_header_buffers 4 512k;
    client_max_body_size 12m;

    ssl_certificate certs/local.trusted.plus.pem;
    ssl_certificate_key certs/local.trusted.plus-key.pem;
    ssl_session_timeout 10m;
    ssl_session_cache shared:LOCAL_TRUSTED_PLUS_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The exported auth widget is built once with /widget/ as its asset
    # prefix. In the local stack ID is mounted below /id, so rewrite widget
    # asset URLs in both the interaction HTML and lazy JavaScript chunks.
    # This mirrors internal/front-nginx/default.conf.template used by the
    # production image.
    sub_filter_types text/javascript application/javascript;
    sub_filter_once off;
    sub_filter '"/widget/' '"/id/widget/';
    sub_filter "'/widget/" "'/id/widget/";

    location = / { return 302 /id/; }
    location = /id { return 301 /id/; }
    location = /skzi { return 301 /skzi/; }
    location = /template { return 301 /template/; }
    location = /cr { return 301 /cr/; }

    # ID issuer, authentication UI and backend API.
    location = /id/.well-known/openid-configuration {
      rewrite ^ /.well-known/openid-configuration break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://oidc;
    }

    location ^~ /id/oidc {
      rewrite ^/id(/oidc.*)$ $1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      # Keep cookies inside the externally mounted ID path. OIDC may emit
      # either already-prefixed paths or its internal /oidc and /api paths.
      proxy_cookie_path ~^/id(/.*)?$ /id$1;
      proxy_cookie_path ~^/oidc(/.*)?$ /id/oidc$1;
      proxy_cookie_path ~^/api(/.*)?$ /id/api$1;
      proxy_cookie_path ~^/(.*)$ /id/$1;
      proxy_pass http://oidc;
      proxy_redirect off;
    }

    location ^~ /id/auth {
      rewrite ^/id(/auth.*)$ $1 break;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
      proxy_pass http://auth;
      proxy_redirect off;
    }

    location ~ ^/id/(api|public|widget|docs)(/|$) {
      rewrite ^/id(/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # Backend cookies default to Path=/ because nginx strips /id before
      # proxying. Rewrite them back to the public mount path.
      proxy_cookie_path ~^/id(/.*)?$ /id$1;
      proxy_cookie_path ~^/(.*)$ /id/$1;
      proxy_pass http://backend;
      proxy_redirect off;
    }

    location /id/ {
      proxy_pass https://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_ssl_verify off;
      proxy_set_header Host localhost:3001;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
    }

    # SKZI BFF/API and SPA.
    location ^~ /skzi/api/ {
      rewrite ^/skzi(/api/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://skzi_backend;
      proxy_redirect off;
    }

    location ^~ /skzi/scim/ {
      rewrite ^/skzi(/scim/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://skzi_backend;
      proxy_redirect off;
    }

    location ^~ /skzi/health {
      rewrite ^/skzi(/health.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://skzi_backend;
      proxy_redirect off;
    }

    location ^~ /skzi/ {
      proxy_pass http://skzi_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:8089;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
    }

    # Template BFF/API and SPA.
    location ^~ /template/api/ {
      rewrite ^/template(/api/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://template_backend;
      proxy_redirect off;
    }

    location ~ ^/template/(scim|health)(/|$) {
      rewrite ^/template(/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://template_backend;
      proxy_redirect off;
    }

    location ^~ /template/ {
      proxy_pass http://template_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:8088;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
    }

    # CR BFF/API and SPA.
    location ^~ /cr/api/ {
      rewrite ^/cr(/api/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://cr_backend;
      proxy_redirect off;
    }

    location ~ ^/cr/(scim|health)(/|$) {
      rewrite ^/cr(/.*)$ $1 break;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://cr_backend;
      proxy_redirect off;
    }

    location ^~ /cr/ {
      proxy_pass http://cr_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host localhost:8090;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
    }
  }
}
